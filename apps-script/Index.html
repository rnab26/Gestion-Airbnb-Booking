<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root{
  --bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--muted:#6b6b70;--line:#e4e2dc;--accent:#1f6f5c;--accent-ink:#fff;
  --airbnb:#e0383e;--airbnb-soft:#ffc4c6;--booking:#2f6fe0;--booking-soft:#c4d6ff;--direct:#2f9d6a;--direct-soft:#c9ecd9;--blocked:#c6c6cc;--blocked-bg:#ececee;
  --warn:#b26a00;--warn-soft:#fff3dc;--err:#c0392b;--err-soft:#fde4e1;--ok:#2f9d6a;--radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141416;--card:#1f1f23;--ink:#f1f1f3;--muted:#a0a0a8;--line:#33333a;--accent:#3fb394;--accent-ink:#0d1f1a;
  --airbnb-soft:#6b2a2d;--booking-soft:#24385f;--direct-soft:#1c3a2c;--blocked:#46464c;--blocked-bg:#2c2c31;--warn-soft:#3d2e12;--err-soft:#47201c;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:12px 16px 96px}
header.top{display:flex;align-items:center;gap:10px;padding:14px 16px 6px;max-width:760px;margin:0 auto}
header.top h1{font-size:19px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.err{color:var(--err);border-color:var(--err)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:42px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.small{padding:6px 10px;min-height:34px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:default}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:42px;height:42px;cursor:pointer;font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
h2{font-size:17px;margin:18px 0 8px}
h3{font-size:15px;margin:0 0 8px}
.banner{border-radius:12px;padding:12px 14px;margin:10px 0;font-size:14px}
.banner.info{background:var(--booking-soft)}
.banner.warn{background:var(--warn-soft)}
.banner.err{background:var(--err-soft)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;max-width:150px;border:0;background:none;padding:9px 2px 10px;font-size:11.5px;color:var(--muted);cursor:pointer}
nav.tabs button .ic{display:block;font-size:19px;line-height:1.2}
nav.tabs button.on{color:var(--accent);font-weight:600}
/* calendrier */
.cal-head{display:flex;align-items:center;gap:6px;margin:6px 0}
.cal-head .title{flex:1;text-align:center;font-weight:600;text-transform:capitalize}
.cal{display:flex;flex-direction:column;gap:6px}
.cal .dows,.cal .wk-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-size:11px;text-align:center;color:var(--muted);padding:2px 0}
.cal .wk{position:relative}
.cal .day{min-height:68px;border-radius:12px;background:var(--card);border:1px solid var(--line);padding:6px;font-size:11px;cursor:pointer;position:relative;text-align:center;display:flex;flex-direction:column;align-items:center}
.cal .day.out{opacity:.35}
.cal .day.past .n{color:var(--muted)}
.cal .day .n{font-weight:600;font-size:14px;line-height:24px;width:26px;height:26px;border-radius:50%}
.cal .day.today .n{background:var(--airbnb);color:#fff}
.cal .day.blocked{background:var(--blocked);border-color:transparent}
.cal .day.blocked .n{text-decoration:line-through;color:var(--muted);font-weight:500}
.cal .day.unbook{background:var(--blocked-bg);border-color:transparent}
.cal .day.unbook .n{color:var(--muted);font-weight:500}
/* séjour en cours : le bandeau scintille */
.cal .bar.now{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 1px 3px rgba(0,0,0,.18);filter:brightness(1)}50%{box-shadow:0 0 0 3px #ffc83d,0 0 14px 3px rgba(255,200,61,.75);filter:brightness(1.2)}}
.sw.now{background:var(--card);box-shadow:0 0 0 2px #ffc83d}
.cur{border:2px solid var(--ok);cursor:pointer}
.cur-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ok);margin-bottom:6px;display:flex;align-items:center}
.cur-empty .cur-h{color:var(--muted)}
.live{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:7px;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion: reduce){.cal .bar.now{animation:none;box-shadow:0 0 0 3px #ffc83d}.live{animation:none}}
.mcard{cursor:pointer}
.mcard>div+div{margin-top:2px}
.cal .day .dot{position:absolute;right:6px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.cal .bar{position:absolute;top:34px;height:26px;border:0;padding:0 8px;color:#fff;font-size:12px;font-weight:600;line-height:26px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;z-index:1;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.cal .bar.s{border-top-left-radius:13px;border-bottom-left-radius:13px}
.cal .bar.e{border-top-right-radius:13px;border-bottom-right-radius:13px}
.cal .bar.l1{top:46px;height:18px;line-height:18px;font-size:10.5px}
.cal .bar.unk{background-image:linear-gradient(90deg,transparent 60%,rgba(255,255,255,.35))}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px}
/* listes */
.item{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin:8px 0;cursor:pointer;width:100%;text-align:left}
.item .bar{width:5px;align-self:stretch;border-radius:4px;flex:none}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600}
.item .amt{font-weight:700;white-space:nowrap}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted);margin-right:4px}
.badge.airbnb{background:var(--airbnb-soft);border-color:transparent;color:var(--ink)}
.badge.booking{background:var(--booking-soft);border-color:transparent;color:var(--ink)}
.badge.direct{background:var(--direct-soft);border-color:transparent;color:var(--ink)}
.badge.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.badge.err{background:var(--err-soft);border-color:transparent;color:var(--err)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
/* revenus */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:620px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .v{font-size:20px;font-weight:700}
.kpi .l{font-size:12px;color:var(--muted)}
.mrow{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.mrow:last-child{border-bottom:0}
details.mdet{margin:0;border-bottom:1px solid var(--line)}
details.mdet:last-child{border-bottom:0}
details.mdet>summary{list-style:none;color:var(--ink);font-size:inherit}
details.mdet>summary::-webkit-details-marker{display:none}
details.mdet>summary .mrow{border-bottom:0}
details.mdet[open]>summary .mrow{font-weight:600}
.pay{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:7px 4px 7px 10px;border-left:3px solid var(--line);margin:0 0 6px 4px;font-size:13px;cursor:pointer}
.pay .muted{font-size:12px}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;margin:6px 0 12px}
.sh-head{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.sh-dates{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.sh-dates>div{display:flex;flex-direction:column}
.sh-dates>div:last-child{text-align:right}
.sh-dates .l{font-size:12px;color:var(--muted)}
.sh-dates b{font-size:17px}
.sh-n{text-align:center;font-size:12px;color:var(--muted);line-height:1.2}
.sh-info{display:grid;gap:6px;margin:10px 2px;font-size:15px}
.sh-info>div{display:flex;gap:8px;align-items:baseline}
.sh-actions{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 6px}
.sh-actions .btn{flex:1;min-width:120px;text-align:center;text-decoration:none;color:inherit;font-weight:600}
.btn.wa-btn{background:#25D366;border-color:#25D366;color:#fff !important}
.sumbox{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0 10px;font-size:14px;line-height:1.6}
.money{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.money b{text-align:right}
.wa{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:#25D366;color:#fff;margin-left:6px;cursor:pointer;text-decoration:none;vertical-align:1px}
.dowhint{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.mbar{height:10px;border-radius:5px;background:var(--bg);overflow:hidden}
.mbar>i{display:block;height:100%;background:var(--accent);border-radius:5px}
/* formulaires */
label.f{display:block;margin:10px 0}
label.f>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=date],input[type=number],input[type=url],input[type=time],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:42px}
textarea{min-height:80px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;margin:10px 0;cursor:pointer}
.check input{width:20px;height:20px;margin-top:1px;flex:none}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
details{margin:8px 0}
summary{cursor:pointer;color:var(--accent);font-size:14px}
.help{font-size:13px;color:var(--muted)}
.help ol{padding-left:20px;margin:6px 0}
/* modale */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:620px){.modal-bg{align-items:center}}
.modal{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 22px}
@media(min-width:620px){.modal{border-radius:18px}}
.modal .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.modal .actions .btn{flex:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:30;max-width:calc(100% - 32px)}
#toast .t{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast .t.error{background:var(--err);color:#fff}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:60px 16px;color:var(--muted)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.linkbox{font-size:12px;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0}
.sticky-save{position:sticky;bottom:70px;margin-top:14px}
</style>
</head>
<body>
<div id="app"><div class="loading"><div class="spin"></div>Chargement…</div></div>
<div id="toast"></div>
<div id="modal"></div>
<script>var BOOT = <?!= bootJson ?>;</script>
<script>
(function () {
'use strict';
var S = { boot: BOOT, data: null, tab: 'planning', month: '', year: 0, resView: 'upcoming', resSource: '', resQuery: '', noteView: 'upcoming', busy: false, loadError: '',
  preview: false, ownerData: null, loadedAt: 0 }; // preview : le propriétaire regarde la page de la gestionnaire (lecture seule)
var SRC = { airbnb: 'Airbnb', booking: 'Booking', direct: 'Direct' };
var MONTHS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
var MONTHS_S = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
var DOW = ['Dim.', 'Lun.', 'Mar.', 'Mer.', 'Jeu.', 'Ven.', 'Sam.'];

// ---------- outils ----------
function $(sel, root) { return (root || document).querySelector(sel); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function utc(s) { var p = s.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
function addDays(s, n) { var d = new Date(utc(s) + n * 864e5); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
function dow(s) { return new Date(utc(s)).getUTCDay(); }
function fmtDate(s, withYear) {
  if (!s) return '?';
  var p = s.split('-');
  return DOW[dow(s)] + ' ' + (+p[2]) + ' ' + MONTHS_S[+p[1] - 1] + (withYear ? ' ' + p[0] : '');
}
var DOW_L = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
function fmtLong(s) { if (!s) return ''; var p = s.split('-'); return DOW_L[dow(s)] + ' ' + (+p[2]) + ' ' + MONTHS[+p[1] - 1]; }
// Lien WhatsApp d'un numéro complet (« +33 6… », « 0033… », « 06… » = France) ; vide pour « …9315 ».
// text : message déjà écrit dans la conversation (la personne n'a plus qu'à appuyer sur Envoyer).
function waLink(phone, text) {
  var s = String(phone || '').trim();
  if (!s || /…|\.\.\./.test(s)) return '';
  var d = s.replace(/[^\d+]/g, '');
  if (/^00/.test(d)) d = d.slice(2);
  else if (/^\+/.test(d)) d = d.slice(1);
  else if (/^0\d{9}$/.test(d)) d = '33' + d.slice(1);
  d = d.replace(/\D/g, '');
  return d.length >= 8 ? 'https://wa.me/' + d + (text ? '?text=' + encodeURIComponent(text) : '') : '';
}
function waChip(phone, text) {
  var u = waLink(phone, text);
  return u ? '<span class="wa" role="link" tabindex="0" data-wa="' + esc(u) + '">WhatsApp</span>' : '';
}
// Message WhatsApp préparé pour la gestionnaire (texte réglable par le propriétaire dans Réglages).
function waMessage(r, s) {
  var tpl = String(s.managerWaMessage || '');
  if (!tpl.trim()) return '';
  var first = String(r.guest || '').trim().split(/\s+/)[0] || '';
  var map = { 'prénom': first, 'prenom': first, 'gestionnaire': s.managerLabel || '', 'arrivée': fmtLong(r.checkin), 'arrivee': fmtLong(r.checkin),
    'départ': fmtLong(r.checkout), 'depart': fmtLong(r.checkout), 'heure': s.checkinTime || '', 'guide': String(s.arrivalGuide || '').trim() };
  var t = tpl.replace(/\{([^{}]+)\}/g, function (m, k) { k = k.trim().toLowerCase(); return Object.prototype.hasOwnProperty.call(map, k) ? map[k] : m; });
  // Repère vide (pas de prénom, pas de guide) : pas de double espace ni de ligne vide en trop.
  return t.split('\n').map(function (l) { return l.replace(/[ \t]{2,}/g, ' ').replace(/ +,/g, ',').replace(/\s+$/, ''); }).join('\n').replace(/\n{3,}/g, '\n\n').trim();
}
// Brut / commission / net d'un séjour (Booking : prix client ; Airbnb : versement avant frais de service hôte).
function moneyRows(r) {
  if (r.net === null || r.net === undefined || !r.counted) return '';
  var approx = r.amountKind === 'facture' || r.amountKind === 'estimé';
  var c = r.commissionAmt;
  var rows = '';
  if (c !== null && c !== undefined) {
    var gross = r.net + c;
    rows += '<span>' + (r.source === 'booking' ? 'Prix payé par le client' : r.source === 'airbnb' ? 'Versement brut (avant frais Airbnb)' : 'Brut') + '</span><b>' + fmtMoney(gross) + '</b>' +
      '<span>' + (r.source === 'booking' ? 'Commission + frais de paiement Booking' : r.source === 'airbnb' ? 'Frais de service hôte Airbnb' : 'Commission') + (gross ? ' (' + (Math.round(c / gross * 1000) / 10).toString().replace('.', ',') + ' %)' : '') + '</span><b>− ' + fmtMoney(c) + '</b>';
  }
  rows += '<span><b>Net pour toi</b>' + (approx ? ' <span class="muted">(' + (r.amountKind === 'facture' ? 'part de la facture' : 'estimé') + ')</span>' : '') + '</span><b>' + (approx ? '≈ ' : '') + fmtMoney(r.net) + '</b>';
  return '<div class="money">' + rows + '</div>';
}
function fmtMoney(n) {
  if (n === null || n === undefined || n === '' || isNaN(n)) return '—';
  return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: Math.abs(n) >= 1000 ? 0 : 2 }).format(n);
}
function ago(iso) {
  if (!iso) return 'jamais';
  var m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1) return 'à l\'instant';
  if (m < 60) return 'il y a ' + m + ' min';
  var h = Math.round(m / 60);
  if (h < 24) return 'il y a ' + h + ' h';
  return 'il y a ' + Math.round(h / 24) + ' j';
}
function monthOf(s) { return s.slice(0, 7); }
function monthTitle(ym) { var p = ym.split('-'); return MONTHS[+p[1] - 1] + ' ' + p[0]; }
function shiftMonth(ym, n) { var p = ym.split('-'); var d = new Date(Date.UTC(+p[0], +p[1] - 1 + n, 1)); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1); }
// Couleur de la plateforme (aussi pour la gestionnaire : demandé par le propriétaire le 26 nov. 2026).
function srcKey(src) { return SRC[src] ? src : 'direct'; }
function srcColor(src) { return 'var(--' + srcKey(src) + ')'; }
function srcSoft(src) { return 'var(--' + srcKey(src) + '-soft)'; }
function cleanErr(e) {
  var m = (e && (e.message || e)) + '';
  return m.replace(/^(Exception|Error|Erreur)\s*:\s*/i, '').replace(/^ScriptError:\s*/i, '');
}
function call(action, payload) {
  return new Promise(function (resolve, reject) {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).api(S.boot.token, action, payload || {});
  });
}
var toastTimer;
function toast(msg, type) {
  var el = $('#toast');
  el.innerHTML = '<div class="t ' + (type || '') + '" role="status">' + esc(msg) + '</div>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.innerHTML = ''; }, type === 'error' ? 7000 : 3200);
}
function isOwner() { return S.boot.mode === 'owner' && !S.preview; }
function nightsOf(r) { return r.nights || 0; }
function occupies(r, d) {
  if (!r.checkin) return false;
  if (!r.checkout) return r.checkin === d;
  return r.checkin <= d && d < r.checkout;
}
// Nuit fermée (calculé sur le serveur) : 'manual' (fermé, gris foncé) ou 'unbookable' (trop court, gris clair).
function closureOn(d) {
  var c = (S.data.closures || []).filter(function (x) { return x.start <= d && d < x.end; })[0];
  return c ? c.kind : '';
}
// Voyageur dans l'appartement en ce moment : arrivé (heure d'arrivée passée) et pas encore parti (heure de départ).
function isCurrent(r) {
  var d = S.data, s = d.settings, t = d.today, h = d.nowTime || '12:00';
  if (!r || !r.checkin || r.status === 'cancelled' || r.status === 'blocked' || r.hidden === '1') return false;
  var out = r.checkout || addDays(r.checkin, 1);
  var started = r.checkin < t || (r.checkin === t && h >= (s.checkinTime || '15:00'));
  var notGone = t < out || (t === out && h < (s.checkoutTime || '10:00'));
  return started && notGone;
}
function currentRes() { return activeRes().filter(isCurrent)[0] || null; }
function activeRes() {
  return S.data.reservations.filter(function (r) { return r.status !== 'cancelled' && r.status !== 'blocked' && r.hidden !== '1'; });
}
function notesOn(d) {
  return S.data.notes.filter(function (n) { return n.date <= d && d <= (n.endDate || n.date); });
}
function guestLabel(r) {
  if (r.status === 'blocked') return 'Fermé sur ' + (SRC[r.source] || 'la plateforme');
  if (r.guest) return r.guest;
  if (!isOwner()) return 'Voyageur';
  if (r.source === 'booking' && r.origin === 'ical') return 'Booking (sans e-mail)';
  return SRC[r.source] || 'Réservation';
}

// ---------- modales ----------
function openModal(html, onMount) {
  var m = $('#modal');
  m.innerHTML = '<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true">' + html + '</div></div>';
  $('.modal-bg', m).addEventListener('click', function (e) { if (e.target === this) closeModal(); });
  if (onMount) onMount($('.modal', m));
}
function closeModal() { $('#modal').innerHTML = ''; }
function confirmDialog(text, okLabel, danger) {
  return new Promise(function (resolve) {
    openModal('<h3>' + esc(text) + '</h3><div class="actions"><button class="btn" data-a="no">Annuler</button>' +
      '<button class="btn ' + (danger ? 'danger' : 'primary') + '" data-a="yes">' + esc(okLabel) + '</button></div>', function (m) {
      m.querySelector('[data-a=no]').onclick = function () { closeModal(); resolve(false); };
      m.querySelector('[data-a=yes]').onclick = function () { closeModal(); resolve(true); };
    });
  });
}

// ---------- actions serveur ----------
function act(action, payload, okMsg, btn) {
  if (S.busy) return Promise.resolve(false);
  if (S.preview) { toast('Aperçu en lecture seule : reviens à ton espace pour modifier.', 'error'); return Promise.resolve(false); }
  S.busy = true;
  var label;
  if (btn) { label = btn.textContent; btn.disabled = true; btn.textContent = '…'; }
  return call(action, payload).then(function (data) {
    S.data = data;
    S.loadedAt = Date.now();
    S.busy = false;
    closeModal();
    render();
    if (okMsg) toast(okMsg);
    return true;
  }, function (e) {
    S.busy = false;
    if (btn) { btn.disabled = false; btn.textContent = label; }
    toast(cleanErr(e), 'error');
    return false;
  });
}

function load() {
  S.loadError = '';
  render();
  call('load').then(function (data) {
    S.data = data;
    S.loadedAt = Date.now();
    if (!S.month) S.month = monthOf(data.today);
    if (!S.year) S.year = +data.today.slice(0, 4);
    render();
    announceShareReady();
  }, function (e) {
    S.loadError = cleanErr(e);
    render();
  });
}

// ---------- rendu ----------
function render() {
  var app = $('#app');
  var mode = S.boot.mode;
  if (mode === 'install') return renderInstall(app);
  if (mode === 'invalid') {
    app.innerHTML = '<div class="wrap"><div class="card" style="margin-top:40px"><h3>Lien invalide</h3>' +
      '<p class="muted">Ce lien n\'est pas (ou plus) valable. Demande un nouveau lien au propriétaire.</p></div></div>';
    return;
  }
  if (S.loadError) {
    app.innerHTML = '<div class="wrap"><div class="banner err" style="margin-top:30px"><b>Impossible de charger les données.</b><br>' + esc(S.loadError) +
      '</div><button class="btn primary" id="retry">Réessayer</button></div>';
    $('#retry').onclick = load;
    return;
  }
  if (!S.data) { app.innerHTML = '<div class="loading"><div class="spin"></div>Chargement…</div>'; return; }
  if (mode === 'manager' || S.preview) return renderManager(app);
  renderOwner(app);
}
// Retour sur l'application après un moment (téléphone en veille, autre appli) : données rafraîchies
// sans rien demander, pour que « locataire actuel » et le séjour qui scintille restent justes.
// Jamais pendant une saisie (fenêtre ouverte, Réglages) pour ne rien effacer.
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible' || !S.data || S.busy || $('#modal').innerHTML) return;
  if ((S.boot.mode !== 'owner' && S.boot.mode !== 'manager') || (isOwner() && S.tab === 'reglages')) return;
  if (Date.now() - S.loadedAt < 5 * 60000) return;
  var wasPreview = S.preview;
  call(wasPreview ? 'previewManager' : 'load').then(function (data) {
    if (S.busy || $('#modal').innerHTML || S.preview !== wasPreview) return;
    S.data = data;
    S.loadedAt = Date.now();
    render();
  }, function () { /* hors connexion : on garde l'affichage actuel */ });
});

function renderInstall(app) {
  app.innerHTML = '<div class="wrap"><div class="card" style="margin-top:30px"><h3>Installation</h3>' +
    '<p>Un clic suffit : je crée ta base de données (un Google Sheet dans ton Drive), tes liens d\'accès et la synchronisation automatique, puis je lis tes e-mails Airbnb et Booking.</p>' +
    '<button class="btn primary" id="go" style="width:100%">Installer</button><p class="muted small" id="st"></p></div></div>';
  $('#go').onclick = function () {
    var b = this;
    b.disabled = true;
    b.textContent = 'Installation…';
    google.script.run.withSuccessHandler(function (res) {
      $('#st').textContent = 'Base créée. Lecture des e-mails en cours (jusqu\'à 2 minutes)…';
      S.boot = { mode: 'owner', token: res.directUrl.split('k=')[1] };
      call('sync').then(function (data) { done(res, data.lastSync); }, function (e) { done(res, { ok: false, message: cleanErr(e) }); });
    }).withFailureHandler(function (e) {
      b.disabled = false;
      b.textContent = 'Réessayer';
      $('#st').textContent = cleanErr(e);
    }).install();
  };
  function done(res, sync) {
    var url = res.ownerUrl;
    app.innerHTML = '<div class="wrap"><div class="card" style="margin-top:30px"><h3>C\'est installé ✅</h3>' +
      (sync && sync.message ? '<p class="small ' + (sync.ok ? 'muted' : '') + '">' + esc(sync.message) + '</p>' : '') +
      '<p>Voici <b>ton lien propriétaire</b>. Il donne accès à tes revenus : garde-le pour toi. Je te l\'ai aussi envoyé par e-mail.</p>' +
      '<div class="linkbox">' + esc(url) + '</div>' +
      '<a class="btn primary" style="display:block;text-align:center;text-decoration:none" href="' + esc(url) + '" target="_top">Ouvrir mon tableau de bord</a>' +
      '<p class="muted small">Dans Chrome : menu ⋮ › « Installer l\'application » (ou « Ajouter à l\'écran d\'accueil »).</p>' +
      (res.directUrl !== url ? '<p class="muted small">Si l\'application ne s\'ouvre pas : <a href="' + esc(res.directUrl) + '" target="_top">lien direct</a>.</p>' : '') + '</div></div>';
  }
}

// ======== propriétaire ========
var TABS = [['planning', '📅', 'Planning'], ['revenus', '💶', 'Revenus'], ['resas', '🧾', 'Réservations'], ['notes', '📝', 'Notes'], ['reglages', '⚙️', 'Réglages']];

function renderOwner(app) {
  var d = S.data;
  var ls = d.lastSync;
  var chip = ls ? '<span class="chip ' + (ls.ok ? '' : 'err') + '" title="' + esc(ls.message) + '">' + (ls.ok ? '✓' : '⚠') + ' ' + esc(ago(ls.at)) + '</span>'
    : '<span class="chip">Jamais synchronisé</span>';
  var html = '<header class="top"><h1>' + esc(d.settings.apartmentName) + '</h1>' + chip +
    '<button class="icon-btn" id="syncBtn" title="Synchroniser maintenant" aria-label="Synchroniser maintenant">↻</button></header><div class="wrap">';
  html += ({ planning: viewPlanning, revenus: viewRevenus, resas: viewResas, notes: viewNotes, reglages: viewSettings })[S.tab]();
  html += '</div><nav class="tabs">' + TABS.map(function (t) {
    return '<button data-tab="' + t[0] + '" class="' + (S.tab === t[0] ? 'on' : '') + '"><span class="ic">' + t[1] + '</span>' + t[2] + '</button>';
  }).join('') + '</nav>';
  app.innerHTML = html;
  app.querySelectorAll('nav.tabs button').forEach(function (b) {
    b.onclick = function () { S.tab = b.getAttribute('data-tab'); render(); window.scrollTo(0, 0); };
  });
  $('#syncBtn').onclick = function () { syncNow(this); };
  bindCommon(app);
  ({ planning: bindPlanning, revenus: bindRevenus, resas: bindResas, notes: bindNotes, reglages: bindSettings })[S.tab](app);
}

function syncNow(btn) {
  toast('Synchronisation en cours…');
  act('sync', {}, null, btn).then(function (ok) {
    if (!ok) return;
    var ls = S.data.lastSync;
    toast(ls && ls.ok ? 'Synchronisé : ' + ls.message.split(' — ')[0] : 'Synchro avec erreurs, voir Réglages › Journal', ls && ls.ok ? '' : 'error');
  });
}

function linkify(t) {
  return esc(t).replace(/https:\/\/[^\s)]+/g, function (u) { return '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>'; });
}

function banners() {
  var d = S.data, out = '';
  if (d.authUrl) {
    out += '<div class="banner warn"><b>Une autorisation Google est nécessaire</b> pour que l\'outil se mette à jour tout seul. ' +
      '<a class="btn small" style="text-decoration:none" target="_blank" rel="noopener" href="' + esc(d.authUrl) + '">Autoriser</a><br>' +
      '<span class="small muted">Choisis ton compte › « Paramètres avancés » si Google avertit › Autoriser. Ensuite : Réglages › Vérifier maintenant.</span></div>';
  }
  if (!d.settings.icalAirbnb || !d.settings.icalBooking) {
    out += '<div class="banner info">Pour des dates toujours à jour, ajoute ' +
      (!d.settings.icalAirbnb && !d.settings.icalBooking ? 'tes liens calendrier Airbnb et Booking' : !d.settings.icalAirbnb ? 'ton lien calendrier Airbnb' : 'ton lien calendrier Booking') +
      '. <button class="btn small" data-goto="reglages">Les ajouter</button></div>';
  }
  if (d.lastSync && !d.lastSync.ok) {
    var em = d.lastSync.message.split('| Erreurs : ')[1] || d.lastSync.message;
    out += '<div class="banner err"><b>Dernière synchro en erreur.</b> ' + esc(em.length > 160 ? em.slice(0, 160) + '…' : em) +
      ' <button class="btn small" data-goto="reglages">Détails</button></div>';
  }
  if (d.overlaps && d.overlaps.length) {
    var byId = {};
    d.reservations.forEach(function (r) { byId[r.id] = r; });
    out += '<div class="banner warn"><b>⚠ Réservations qui se chevauchent</b> (double réservation ?)<br>' + d.overlaps.map(function (p) {
      var a = byId[p[0]], b = byId[p[1]];
      return esc(guestLabel(a)) + ' (' + fmtDate(a.checkin) + '→' + fmtDate(a.checkout) + ') et ' + esc(guestLabel(b)) + ' (' + fmtDate(b.checkin) + '→' + fmtDate(b.checkout) + ')';
    }).join('<br>') + '</div>';

  return out;
}

// Boutons WhatsApp (dans les cartes cliquables aussi) : ouvre la conversation sans ouvrir la réservation.
document.addEventListener('click', function (e) {
  var w = e.target && e.target.closest ? e.target.closest('[data-wa]') : null;
  if (!w) return;

  e.stopPropagation();
  window.open(w.getAttribute('data-wa'), '_blank', 'noopener');
}, true);
function bindCommon(root) {
  root.querySelectorAll('[data-goto]').forEach(function (b) { b.onclick = function () { S.tab = b.getAttribute('data-goto'); render(); }; });
  root.querySelectorAll('[data-missing]').forEach(function (b) { b.onclick = function () { S.tab = 'resas'; S.resView = 'missing'; render(); }; });
  root.querySelectorAll('[data-res]').forEach(function (b) {
    b.onclick = function () {
      var r = S.data.reservations.filter(function (x) { return x.id === b.getAttribute('data-res'); })[0];
      if (r) (isOwner() ? editReservation : showManagerRes)(r);
    };
  });
  root.querySelectorAll('[data-note]').forEach(function (b) {
    b.onclick = function () {
      var n = S.data.notes.filter(function (x) { return x.id === b.getAttribute('data-note'); })[0];
      if (n) editNote(n);
    };
  });
}

// ----- calendrier (commun) -----
function calendarHtml() {
  var ym = S.month, first = ym + '-01';
  var startOffset = (dow(first) + 6) % 7; // semaine commençant lundi
  var start = addDays(first, -startOffset);
  var res = activeRes().filter(function (r) { return r.checkin; }).sort(function (a, b) { return a.checkin < b.checkin ? -1 : 1; });
  var html = '<div class="cal-head"><button class="icon-btn" id="calPrev" aria-label="Mois précédent">‹</button><div class="title">' + monthTitle(ym) +
    '</div><button class="icon-btn" id="calNext" aria-label="Mois suivant">›</button></div>' +
    '<div class="row" style="justify-content:center;margin-bottom:6px"><button class="btn small" id="calToday">Aujourd\'hui</button></div><div class="cal"><div class="dows">' +
    ['lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.', 'dim.'].map(function (x) { return '<div class="dow">' + x + '</div>'; }).join('') + '</div>';
  for (var w = 0; w < 6; w++) {
    var ws = addDays(start, w * 7), we = addDays(ws, 7);
    if (w === 5 && monthOf(ws) !== ym) break;
    html += '<div class="wk"><div class="wk-days">';
    for (var i = 0; i < 7; i++) {
      var d = addDays(ws, i);
      var busy = res.some(function (r) { return occupies(r, d); });
      var cl = busy ? '' : closureOn(d);
      var nn = notesOn(d).length;
      html += '<button class="day' + (monthOf(d) !== ym ? ' out' : '') + (d === S.data.today ? ' today' : '') + (d < S.data.today ? ' past' : '') +
        (cl === 'manual' ? ' blocked' : cl === 'unbookable' ? ' unbook' : '') + '" data-day="' + d + '"' +
        (cl ? ' title="' + (cl === 'manual' ? 'Fermé' : 'Non réservable (durée minimale)') + '"' : '') + '><span class="n">' + (+d.slice(8)) + '</span>' +
        (nn ? '<span class="dot" title="' + nn + ' note(s)"></span>' : '') + '</button>';
    }
    html += '</div>';
    // Bandeaux de séjour, à la façon d'Airbnb : du milieu du jour d'arrivée au milieu du jour de départ.
    var lanes = [];
    res.forEach(function (r) {
      var end = r.checkout || addDays(r.checkin, 1);
      if (end < ws || (end === ws && !r.checkout) || r.checkin >= we) return;
      var lane = 0;
      while (lanes[lane] && lanes[lane] > r.checkin) lane++;
      lanes[lane] = end;
      if (lane > 1) return;
      var startsHere = r.checkin >= ws, endsHere = end < we;
      var a = startsHere ? (utc(r.checkin) - utc(ws)) / 864e5 + 0.5 : 0;
      var b = end < we ? (utc(end) - utc(ws)) / 864e5 + (r.checkout ? 0.5 : 0.95) : 7;
      var gap = 'calc((100% - 36px) / 7 + 6px)';
      html += '<button class="bar' + (startsHere ? ' s' : '') + (endsHere ? ' e' : '') + (lane ? ' l1' : '') + (r.checkout ? '' : ' unk') + (isCurrent(r) ? ' now' : '') + '" data-res="' + esc(r.id) +
        '" data-bar-start="' + r.checkin + '" style="background:' + srcColor(r.source) + ';left:calc(' + a + ' * ' + gap + ');width:calc(' + (b - a) + ' * ' + gap + ' - 6px)">' +
        (b - a >= 1.4 ? esc(guestLabel(r)) + (r.checkout ? '' : ' · départ ?') : '') + '</button>'; // trop court : le nom s'affiche sur la ligne suivante
    });
    html += '</div>';
  }
  var direct = isOwner() || res.some(function (r) { return srcKey(r.source) === 'direct'; });
  html += '</div><div class="legend"><span><i class="sw" style="background:var(--airbnb)"></i>Airbnb</span><span><i class="sw" style="background:var(--booking)"></i>Booking</span>' +
    (direct ? '<span><i class="sw" style="background:var(--direct)"></i>Direct</span>' : '') +
    '<span><i class="sw now"></i>En cours</span><span><i class="sw" style="border:1px solid var(--line)"></i>Libre</span>' +
    '<span><i class="sw" style="background:var(--blocked)"></i>Fermé</span><span><i class="sw" style="background:var(--blocked-bg);border:1px solid var(--line)"></i>Non réservable</span>' +
    '<span><i class="sw" style="background:var(--warn);border-radius:50%"></i>Note</span></div>';
  return html;
}
function bindCalendar(root) {
  $('#calPrev', root).onclick = function () { S.month = shiftMonth(S.month, -1); render(); };
  $('#calNext', root).onclick = function () { S.month = shiftMonth(S.month, 1); render(); };
  $('#calToday', root).onclick = function () { S.month = monthOf(S.data.today); render(); };
  root.querySelectorAll('[data-day]').forEach(function (b) { b.onclick = function () { showDay(b.getAttribute('data-day')); }; });
}

function resCard(r, opts) {
  opts = opts || {};
  var badges = '';
  if (isOwner()) {
    // La couleur de la barre dit déjà la plateforme, le « ≈ » dit déjà que le montant est estimé.
    if (r.status === 'cancelled') badges += '<span class="badge err">' + (r.autoStatus === 'absent' ? 'Annulée (plus dans le calendrier)' : 'Annulée') + '</span>';
    if (r.hidden === '1') badges += '<span class="badge">Masquée</span>';
    if (r.missingAmount) badges += '<span class="badge warn">Montant à saisir</span>';
    if (!r.checkout && r.status === 'confirmed') badges += '<span class="badge warn">Départ inconnu</span>';
  }
  var hasNet = isOwner() && r.net !== null && r.counted;
  var amt = isOwner() ? '<span class="amt">' + (hasNet ? (r.amountKind === 'facture' || r.amountKind === 'estimé' ? '≈ ' : '') + fmtMoney(r.net) : '') +
    (hasNet && r.commissionAmt !== null && r.commissionAmt !== undefined ? '<span class="small muted" style="display:block;text-align:right;font-weight:400">comm. ' + fmtMoney(r.commissionAmt) + '</span>' : '') + '</span>' : '';
  var sub = fmtDate(r.checkin) + ' → ' + (r.checkout ? fmtDate(r.checkout) : '?') + (r.nights ? ' · ' + r.nights + ' nuit' + (r.nights > 1 ? 's' : '') : '');
  var contact = [r.guestsText ? '👥 ' + esc(r.guestsText) : (r.guestsCount ? '👥 ' + esc(r.guestsCount) + ' pers.' : ''), r.location ? '🌍 ' + esc(r.location) : '',
    r.phone ? '📞 ' + esc(r.phone) + waChip(r.phone) : ''].filter(Boolean).join(' · ');
  return '<button class="item" data-res="' + esc(r.id) + '"><span class="bar" style="background:' + srcColor(r.source) + '"></span><span class="main"><span class="spread"><span class="t">' +
    esc(guestLabel(r)) + '</span>' + amt + '</span><span class="small muted" style="display:block">' + sub + '</span>' +
    (contact ? '<span class="small" style="display:block">' + contact + '</span>' : '') +
    (badges ? '<span style="display:block;margin-top:4px">' + badges + '</span>' : '') +
    (r.sharedNote && !opts.noShared ? '<span class="small" style="display:block;margin-top:4px">💬 ' + esc(r.sharedNote) + '</span>' : '') + '</span></button>';
}
function noteCard(n) {
  var who = n.author === 'manager' ? '<span class="badge">' + esc(S.data.settings.managerLabel || 'Gestionnaire') + '</span>' : '';
  var vis = isOwner() && n.author !== 'manager' ? (n.visible === '1' ? '<span class="badge direct">Visible gestionnaire</span>' : '<span class="badge">Privée</span>') : '';
  return '<button class="item" data-note="' + esc(n.id) + '"><span class="bar" style="background:var(--warn)"></span><span class="main"><span class="small muted" style="display:block">📝 ' +
    fmtDate(n.date) + (n.endDate ? ' → ' + fmtDate(n.endDate) : '') + '</span><span style="display:block;white-space:pre-wrap">' + esc(n.text) + '</span>' +
    (who || vis ? '<span style="display:block;margin-top:4px">' + who + vis + '</span>' : '') + '</span></button>';
}

function showDay(d) {
  var res = S.data.reservations.filter(function (r) {
    return r.hidden !== '1' && r.status !== 'cancelled' && (r.status !== 'blocked' || isOwner()) && (occupies(r, d) || r.checkout === d);
  });
  var notes = notesOn(d);
  var canNote = !S.preview && (isOwner() || S.data.settings.managerCanAddNotes);
  var cl = closureOn(d);
  var html = '<div class="spread"><h3>' + fmtDate(d, true) + '</h3><button class="btn ghost small" data-close>✕</button></div>';
  if (cl === 'unbookable' && !res.some(function (r) { return r.status !== 'blocked' && occupies(r, d); })) {
    html += '<p class="muted">Non réservable : trou trop court entre deux séjours (durée minimale' + (isOwner() ? ' : ' + esc(S.data.settings.minNights) + ' nuits, réglable dans Réglages' : '') + ').</p>';
  } else if (cl === 'manual' && !isOwner()) {
    html += '<p class="muted">Fermé à la réservation ce jour-là.</p>';
  } else if (!res.length && !notes.length) html += '<p class="muted">Rien ce jour-là : logement libre.</p>';
  res.forEach(function (r) {
    var what = r.status === 'blocked' ? 'Fermé' : r.checkin === d ? 'Arrivée' : r.checkout === d ? 'Départ' : 'Séjour en cours';
    html += '<div class="small muted" style="margin-top:8px">' + what + '</div>' + resCard(r);
  });
  notes.forEach(function (n) { html += noteCard(n); });
  html += '<div class="actions">' + (canNote ? '<button class="btn" data-addnote>+ Note ce jour</button>' : '') +
    (isOwner() ? '<button class="btn" data-addres>+ Réservation</button>' : '') + '</div>';
  openModal(html, function (m) {
    m.querySelector('[data-close]').onclick = closeModal;
    bindCommon(m);
    var an = m.querySelector('[data-addnote]');
    if (an) an.onclick = function () { editNote({ date: d, visible: '1' }); };
    var ar = m.querySelector('[data-addres]');
    if (ar) ar.onclick = function () { editReservation({ checkin: d, checkout: addDays(d, 1), source: 'direct', origin: 'manual', status: 'confirmed' }); };
  });
}

// ----- planning -----
function viewPlanning() {
  var ym = S.month;
  var res = S.data.reservations.filter(function (r) {
    return r.hidden !== '1' && r.status !== 'blocked' && r.checkin && (monthOf(r.checkin) === ym || (r.checkout && monthOf(r.checkout) === ym) || (r.checkin < ym + '-01' && r.checkout > ym + '-31'));
  });
  var notes = S.data.notes.filter(function (n) { return monthOf(n.date) === ym || (n.endDate && n.date < ym + '-01' && n.endDate >= ym + '-01'); });
  var html = banners() + '<div class="card">' + calendarHtml() + '</div>';

  }

  if (!p || !p.months) return '';
  var ym = S.month || S.data.today.slice(0, 7);
  var m = p.months[ym] || { count: 0, amount: 0, paid: 0, toCome: 0 };
  var mo = +ym.slice(5) - 1;
  var label = MONTHS[mo].charAt(0).toUpperCase() + MONTHS[mo].slice(1) + (ym.slice(0, 4) !== S.data.today.slice(0, 4) ? ' ' + ym.slice(0, 4) : '');
  return '<div class="card" id="payCard"><div class="spread"><h3 style="margin:0">💶 Tes revenus · ' + label + '</h3><b style="font-size:22px">' + fmtEur(m.amount) + '</b></div>' +
    '<div class="small muted">' + (m.count ? m.count + ' départ' + (m.count > 1 ? 's' : '') + ' × ' + fmtEur(p.fee) : 'Aucun départ ce mois-ci') + '</div>' +
    '<div class="spread small" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)"><span>✅ Déjà perçu <b>' + fmtEur(m.paid) + '</b></span><span>⏳ À venir <b>' + fmtEur(m.toCome) + '</b></span></div></div>';
}
function renderManager(app) {
  var d = S.data, s = d.settings, today = d.today;
  var cur = currentRes();
  // Le séjour en cours a sa propre case : pas répété dessous (un départ du jour reste, pour son ménage).
  var upcoming = activeRes().filter(function (r) { return (r.checkout || r.checkin) >= today && (!cur || r.id !== cur.id); });
  var html = '<header class="top"><h1>' + esc(s.apartmentName) + '</h1>' +
    (S.preview ? '<button class="btn small" id="exitPreview">← Mon espace</button>' : '<span class="chip">Planning</span>') +
    '<button class="icon-btn" id="reload" title="Actualiser" aria-label="Actualiser">↻</button></header><div class="wrap">';
  if (S.preview) html += '<div class="banner info"><b>Aperçu</b> : voici exactement ce que voit ' + esc(s.managerLabel || 'la gestionnaire') + ' (lecture seule). « ← Mon espace » pour revenir.</div>';
  html += payHtml(d.pay);
  html += '<div class="card">' + calendarHtml() + '</div>';
  // Locataire actuel : qui est dans l'appartement en ce moment.
  if (cur) {
    html += '<div class="card cur mcard" id="curCard" data-mres="' + esc(cur.id) + '" role="button" tabindex="0"><div class="cur-h"><span class="live"></span>Locataire actuel</div>' + mgrBody(cur) + '</div>';
  } else {
    var nx = upcoming.filter(function (r) { return r.checkin >= today; })[0];
    html += '<div class="card cur-empty" id="curCard"><div class="cur-h">Locataire actuel</div><div class="small muted">Personne dans l\'appartement en ce moment' +
      (nx ? '. Prochaine arrivée : <b>' + esc(nx.guest || 'Voyageur') + '</b>, ' + fmtDate(nx.checkin) + ' dès ' + esc(s.checkinTime) : '') + '.</div></div>';
  }
  html += '<h2>Prochains passages</h2>';
  if (!upcoming.length) html += '<div class="empty">Aucune réservation à venir.</div>';
  upcoming.forEach(function (r) { html += '<div class="card mcard" data-mres="' + esc(r.id) + '" role="button" tabindex="0">' + mgrBody(r) + '</div>'; });
  var notes = d.notes.filter(function (n) { return (n.endDate || n.date) >= today; }).sort(function (a, b) { return a.date.localeCompare(b.date); });
  html += '<div class="spread"><h2>Notes</h2>' + (s.managerCanAddNotes && !S.preview ? '<button class="btn primary small" id="mAddNote">+ Note</button>' : '') + '</div>';
  if (!notes.length) html += '<div class="empty">Aucune note à venir.</div>';
  html += notes.map(noteCard).join('');
  html += '<p class="help" style="text-align:center;margin-top:24px">Touche un séjour ou un jour du calendrier pour le détail.</p></div>';
  app.innerHTML = html;
  bindCalendar(app);
  bindCommon(app);
  app.querySelectorAll('[data-mres]').forEach(function (c) {
    c.onclick = function (e) {
      if (e.target.closest('a,[data-wa]')) return; // appeler / WhatsApp : sans ouvrir la fiche
      var r = S.data.reservations.filter(function (x) { return x.id === c.getAttribute('data-mres'); })[0];
      if (r) showManagerRes(r);
    };
  });
  $('#reload').onclick = function () {
    var b = this; b.disabled = true;
    call(S.preview ? 'previewManager' : 'load').then(function (data) { S.data = data; S.loadedAt = Date.now(); render(); toast('Planning à jour'); }, function (e) { b.disabled = false; toast(cleanErr(e), 'error'); });
  };
  var xp = $('#exitPreview');
  if (xp) xp.onclick = exitPreview;
  var an = $('#mAddNote');
  if (an) an.onclick = function () { editNote({ date: today, author: 'manager' }); };
}
function showManagerRes(r) {
  openModal('<div class="spread"><h3>' + (isCurrent(r) ? '🟢 Locataire actuel' : 'Séjour') + '</h3><button class="btn ghost small" data-close>✕</button></div>' +
    '<div class="sheet">' + mgrBody(r, true) + '</div>', function (m) {
    m.querySelector('[data-close]').onclick = closeModal;
  });
}
// Aperçu de la page de la gestionnaire dans l'application du propriétaire : on n'ouvre plus son lien,
// qui remplaçait l'accès propriétaire enregistré dans l'application installée (bug du 26 nov. 2026).
function openPreview(btn) {
  if (S.busy) return;
  S.busy = true;
  var label = btn.textContent; btn.disabled = true; btn.textContent = '…';
  call('previewManager').then(function (data) {
    S.busy = false;
    S.ownerData = S.data;
    S.data = data;
    S.preview = true;
    S.loadedAt = Date.now();
    render();
    window.scrollTo(0, 0);
  }, function (e) {
    S.busy = false; btn.disabled = false; btn.textContent = label;
    toast(cleanErr(e), 'error');
  });
}
function exitPreview() {
  if (!S.preview) return;
  closeModal();
  S.data = S.ownerData;
  S.ownerData = null;
  S.preview = false;
  S.tab = 'reglages';
  render();
  var c = $('#previewMgr');
  if (c && c.scrollIntoView) c.scrollIntoView({ block: 'center' });
}

if (S.boot.mode === 'owner' || S.boot.mode === 'manager') load(); else render();
})();
</script>
</body>
</html>
