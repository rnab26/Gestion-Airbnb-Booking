<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<title>Gestion location</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --bg:#f6f5f2; --ink:#1d1d1f; --muted:#6b6b70; --accent:#1f6f5c; --card:#fff; --line:#e4e2dc; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141416; --ink:#f1f1f3; --muted:#a0a0a8; --accent:#3fb394; --card:#1f1f23; --line:#33333a; } }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; background:var(--bg); }
  .box { max-width:460px; margin:0 auto; padding:40px 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:12px; }
  .btn { display:inline-block; background:var(--accent); color:#fff; border:0; border-radius:10px; padding:12px 16px; font:inherit; font-weight:600; text-decoration:none; cursor:pointer; }
  .muted { color:var(--muted); font-size:14px; }
  #install { display:none; position:fixed; left:12px; right:12px; bottom:12px; z-index:5; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; box-shadow:0 8px 24px rgba(0,0,0,.2); align-items:center; gap:10px; }
  #install span { flex:1; font-size:14px; }
  #install button.x { background:none; border:0; font-size:18px; color:var(--muted); cursor:pointer; }
  #back { display:none; position:fixed; right:12px; bottom:76px; z-index:6; box-shadow:0 6px 18px rgba(0,0,0,.25); }
</style>
</head>
<body>
<div id="root"></div>
<div id="install"><span>Installer l'application sur cet appareil ?</span><button class="btn" id="installBtn">Installer</button><button class="x" id="installNo" aria-label="Plus tard">✕</button></div>
<button class="btn" id="back">↩ Mon espace</button>
<script>
(function () {
  'use strict';
  // Lien reçu : …/#https://script.google.com/macros/s/…/exec?k=…  (le # n'est jamais envoyé au serveur).
  var ALLOWED = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec\?k=[0-9a-f]{64}$/;
  var KEY = 'gl-app-url';
  // Lien propriétaire, retenu dès que la page propriétaire s'est affichée ici : si un autre lien
  // (celui de la gestionnaire, ouvert pour voir sa page) le remplace, « ↩ Mon espace » y ramène.
  var OWNER_KEY = 'gl-owner-url';
  function store(v, k) { try { if (v) localStorage.setItem(k || KEY, v); else localStorage.removeItem(k || KEY); } catch (e) {} }
  function stored(k) { try { return localStorage.getItem(k || KEY) || ''; } catch (e) { return ''; } }
  var fromHash = decodeURIComponent((location.hash || '').slice(1));
  var url = '';
  if (ALLOWED.test(fromHash)) { url = fromHash; store(url); history.replaceState(null, '', location.pathname); }
  else url = stored();
  var root = document.getElementById('root');
  if (!url) {
    root.innerHTML = '<div class="box"><h2>Gestion location</h2><div class="card"><p>Ouvre le lien d\'accès que tu as reçu (par WhatsApp ou par e-mail) : l\'application s\'en souviendra ensuite.</p>' +
      '<p class="muted">' + (fromHash ? 'Ce lien n\'est pas valide.' : 'Aucun lien enregistré sur cet appareil.') + '</p></div></div>';
  } else {
    var f = document.createElement('iframe');
    f.src = url;
    f.title = 'Gestion location';
    f.allow = 'clipboard-write';
    root.appendChild(f);
  }
  // Fichier reçu par « Partager › Gestion location » (Android), mis de côté par le service worker :
  // transmis à l'application dès qu'elle se déclare prête (elle demande confirmation avant d'importer).
  var shared = null;
  if (/[?&]shared=1(&|$)/.test(location.search)) {
    history.replaceState(null, '', location.pathname);
    shared = ('caches' in window ? caches.open('gl-share').then(function (c) {
      return c.match('./shared-file').then(function (r) {
        if (!r) return null;
        var name = decodeURIComponent(r.headers.get('X-Name') || 'export');
        return r.blob().then(function (b) {
          return new Promise(function (ok) {
            var fr = new FileReader();
            fr.onload = function () { ok({ name: name, data: String(fr.result).split(',')[1] || '' }); };
            fr.onerror = function () { ok(null); };
            fr.readAsDataURL(b);
          });
        }).then(function (file) { c.delete('./shared-file'); return file; });
      });
    }) : Promise.resolve(null)).catch(function () { return null; });
  }
  var back = document.getElementById('back');
  var ownerUrl = stored(OWNER_KEY);
  if (url && ownerUrl && ownerUrl !== url) back.style.display = 'inline-block';
  back.onclick = function () { store(ownerUrl); location.reload(); };
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.type !== 'gl-ready' || !e.source) return;
    if (!/^https:\/\/(script\.google\.com|[a-z0-9-]+\.googleusercontent\.com)$/.test(e.origin)) return;
    // Seule la page propriétaire envoie « gl-ready » : le lien affiché est donc le lien propriétaire.
    if (url && ALLOWED.test(url)) { store(url, OWNER_KEY); ownerUrl = url; back.style.display = 'none'; }
    if (!shared) return;
    var p = shared, src = e.source, origin = e.origin;
    shared = null;
    p.then(function (file) { if (file) src.postMessage({ type: 'gl-shared-file', name: file.name, data: file.data }, origin); });
  });
  // Nouveau lien ouvert alors que l'application est déjà affichée : on recharge.
  window.addEventListener('hashchange', function () { location.reload(); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  var deferred = null, bar = document.getElementById('install');
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferred = e;
    try { if (localStorage.getItem('gl-install-no')) return; } catch (x) {}
    bar.style.display = 'flex';
  });
  document.getElementById('installBtn').onclick = function () {
    bar.style.display = 'none';
    if (deferred) { deferred.prompt(); deferred = null; }
  };
  document.getElementById('installNo').onclick = function () {
    bar.style.display = 'none';
    try { localStorage.setItem('gl-install-no', '1'); } catch (x) {}
  };
  window.addEventListener('appinstalled', function () { bar.style.display = 'none'; });
})();
</script>
</body>
</html>
